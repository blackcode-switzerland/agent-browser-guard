# Browser tests run here, on Linux CI, never on a person's machine.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node agent-browser-guard.mjs check
      - run: npm run test:browser
      - name: The per-person installer (no registration), then its check
        run: |
          sh install/install.sh --no-register
          sh install/install.sh --check-only
        env:
          AGENT_BROWSER_GUARD_ROOT: ${{ runner.temp }}/agent-browser-guard
